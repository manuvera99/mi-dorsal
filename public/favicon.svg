<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="mi-dorsal">
  <!-- Dorsal estilizado: rectángulo rojo con número, "hilo" curvo a la izquierda -->
  <title>mi-dorsal</title>
  <defs>
    <linearGradient id="dorsal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Hilo curvo (línea que "une" el dorsal) -->
  <path d="M 8 50 Q 25 30, 40 50 T 60 50" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <!-- Cuerpo del dorsal (rectángulo con esquinas suaves) -->
  <rect x="42" y="22" width="48" height="56" rx="6" ry="6" fill="url(#dorsal-bg)"/>
  <!-- Pinholes del dorsal (esquinas superiores) -->
  <circle cx="50" cy="28" r="1.6" fill="#ffffff" opacity="0.85"/>
  <circle cx="82" cy="28" r="1.6" fill="#ffffff" opacity="0.85"/>
  <!-- "Mi" wordmark minimalista -->
  <text x="66" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">mi</text>
  <!-- Dorsal number -->
  <text x="66" y="73" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">42</text>
</svg>
