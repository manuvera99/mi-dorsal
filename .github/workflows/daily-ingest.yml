name: Daily race ingest (sincronización nocturna)

on:
  schedule:
    # Cada día a las 02:00 UTC = 04:00 hora España verano / 03:00 invierno
    # Manu lo quiere "por la noche" para pillar carreras recién publicadas
    - cron: '0 2 * * *'
  workflow_dispatch:  # Botón manual desde GitHub Actions (test)

jobs:
  ingest:
    name: Ingest desde todas las fuentes
    runs-on: ubuntu-latest
    # 45 min (antes 30): con el nuevo step de deploy Convex (0/11) +
    # unificación de JSONs (8.5/11) + geocoding de más carreras nuevas
    # cada noche, 30 min se quedaba corto y cancelaba el geocoding final
    # a mitad (confirmado 2026-09-11, run 34602490190: "exceeded the
    # maximum execution time of 30m0s" en el paso 9/9 — numeración previa
    # a añadir Cruzando la Meta y Carreraspopulares, ver paso 11/11 actual).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # ------------------------------------------------------------------
      # 0/10 Deploy Convex — garantiza que el backend real (funciones +
      # schema) está sincronizado con este commit ANTES de ingestar.
      # Sin este paso, un `git push` a convex/*.ts sin `npx convex deploy`
      # manual deja el backend desincronizado y el ingest de esa noche
      # falla en silencio (ArgumentValidationError / "Could not find public
      # function" — nos pasó varias noches seguidas, ver 2026-09-11).
      # Sin continue-on-error: si el deploy falla, todo el job debe fallar
      # (ingestar contra un backend desincronizado es peor que no ingestar).
      # ------------------------------------------------------------------

      - name: 0/10 Deploy Convex (sincroniza backend con este commit)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "❌ CONVEX_DEPLOY_KEY no configurado como secret en GitHub"
            exit 1
          fi
          npx convex deploy

      # ------------------------------------------------------------------
      # Scripts nuevos (suben DIRECTO a Convex vía systemUpsert idempotente)
      # ------------------------------------------------------------------

      - name: 1/10 Ingest Sportmaniacs (API REST, 25k carreras)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "=== Sportmaniacs API (1-2 requests, para al no encontrar futuras) ==="
          npm run ingest:sportmaniacs -- --upload 2>&1 | tail -30 || echo "⚠️  Sportmaniacs failed, continuing"
        continue-on-error: true

      - name: 2/10 Ingest Agenda Sureste (Supabase REST, ~200 carreras)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "=== Agenda Sureste (Supabase REST) ==="
          npm run ingest:correbirras 2>&1 | tail -30 || echo "⚠️  Agenda Sureste failed, continuing"
        continue-on-error: true

      - name: 3/10 Ingest Cruzando la Meta (API REST, resultados Almería/Granada)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "=== Cruzando la Meta (API REST) ==="
          npm run ingest:cruzandolameta -- --upload 2>&1 | tail -30 || echo "⚠️  Cruzando la Meta failed, continuing"
        continue-on-error: true

      # ------------------------------------------------------------------
      # Scripts viejos (escriben a scripts/output/*.json)
      # ingest:to-convex los une y sube via systemUpsert
      # ------------------------------------------------------------------

      - name: 4/10 Ingest Carreraspopulares (44 filtros HTML, ~120 carreras)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "=== Carreraspopulares (44 filtros, autodeteccion de paginacion) ==="
          # 1) Scrapea 44 filtros (CCAA + distancias + modalidades + homologadas)
          npm run ingest:carreraspopulares:scrape 2>&1 | tail -30 || echo "⚠️  Scrape failed, continuing"
          # 2) Sube directo a Convex via systemUpsert (idempotente)
          npm run ingest:carreraspopulares 2>&1 | tail -30 || echo "⚠️  Ingest carreraspopulares failed, continuing"
        continue-on-error: true

      - name: 5/10 Ingest RFEA (PDF + scraping)
        run: |
          echo "=== RFEA (Real Federación Española de Atletismo) ==="
          npm run ingest:rfea 2>&1 | tail -20 || echo "⚠️  RFEA failed, continuing"
        continue-on-error: true

      - name: 6/10 Ingest FEDME (scraping HTML)
        run: |
          echo "=== FEDME (Federación Deportes de Montaña) ==="
          npm run ingest:fedme 2>&1 | tail -20 || echo "⚠️  FEDME failed, continuing"
        continue-on-error: true

      - name: 7/10 Ingest ITRA (scraping, 503 parcial)
        run: |
          echo "=== ITRA (International Trail Running) ==="
          npm run ingest:itra 2>&1 | tail -20 || echo "⚠️  ITRA failed, continuing"
        continue-on-error: true

      - name: 8/10 Ingest Runedia (scraping HTML)
        run: |
          echo "=== Runedia (Mundo Deportivo) ==="
          npm run ingest:runedia 2>&1 | tail -20 || echo "⚠️  Runedia failed, continuing"
        continue-on-error: true

      # ------------------------------------------------------------------
      # Unificar los JSON individuales (rfea/fedme/itra/runedia-races.json,
      # recién generados por los steps 3-6 de ESTA ejecución) en
      # all-races.json. Sin este step, ingest:to-convex subía el
      # all-races.json que hubiera en el repo — potencialmente de días
      # atrás — ignorando los datos recién scrapeados (bug encontrado en
      # auditoría 2026-09-11: all-races.json llevaba fosilizado desde el
      # 2 de septiembre).
      # ------------------------------------------------------------------

      - name: 8.5/10 Unificar JSONs scrapeados (rfea+fedme+itra+runedia → all-races.json)
        run: |
          echo "=== Unificar JSONs en all-races.json ==="
          npx tsx scripts/ingest-all.ts 2>&1 | tail -30 || echo "⚠️  Unificación falló, continuing"
        continue-on-error: true

      # Este step también envía el email de resumen al admin al terminar
      # (dataSources.sendIngestSummaryEmail, disparado desde
      # scripts/ingest-to-convex.ts) — es el último paso que registra sync
      # de todas las fuentes, así que es el punto correcto para el resumen
      # de la corrida completa (Sportmaniacs y Agenda Sureste incluidos).
      - name: 9/10 Push JSONs a Convex (RFEA/FEDME/ITRA/Runedia) + email resumen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "❌ CONVEX_DEPLOY_KEY no configurado como secret en GitHub"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "❌ NEXT_PUBLIC_CONVEX_URL no configurado como secret en GitHub"
            exit 1
          fi
          echo "=== Unificar y subir JSONs a Convex ==="
          CONVEX_DEPLOYMENT="dev:manuvera08:mi-dorsal" \
            npm run ingest:to-convex 2>&1 | tail -30 || echo "⚠️  to-convex failed"

      # ------------------------------------------------------------------
      # 10/10 Deep Extract IA — enriquece carreras con officialUrl.
      # Modo priority: procesa primero las que NO tienen extractedAt,
      # luego las que les faltan longDescription/altimetryData/raceFormats.
      # --limit=30 procesa 30 carreras por noche (cubre 375 en ~13 días).
      # Si los secrets de IA no están, falla gracefully y sigue.
      # ------------------------------------------------------------------

      - name: 10/10 Deep Extract IA (MiniMax M3, 30 carreras prioritarias)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⚠️  OPENAI_API_KEY no configurado — saltando deep extract"
            echo "    Añade OPENAI_API_KEY, OPENAI_BASE_URL y OPENAI_MODEL como secrets en GitHub"
            exit 0
          fi
          echo "=== Deep Extract (priority mode, 30 carreras) ==="
          npx tsx scripts/deep-extract-all.ts --priority --limit=30 --delay=2000 2>&1 | tail -60 \
            || echo "⚠️  Deep extract failed, continuing"
        continue-on-error: true

      # ------------------------------------------------------------------
      # 11/11 Geocodificación — asigna lat/lng a carreras nuevas para el
      # filtro de distancia del usuario. Nominatim (OpenStreetMap, sin key).
      # ------------------------------------------------------------------

      - name: 11/11 Geocodificar carreras nuevas (Nominatim)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "=== Geocodificar carreras sin lat/lng (Nominatim) ==="
          npx tsx scripts/geocode-races.ts --only-missing 2>&1 | tail -30 \
            || echo "⚠️  Geocoding failed, continuing"
        continue-on-error: true

      # ------------------------------------------------------------------
      # Resumen
      # ------------------------------------------------------------------

      - name: Resumen
        if: always()
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          echo "============================================"
          echo "  Ingest diario terminado: $(date -u)"
          echo "============================================"
          echo ""
          echo "BBDD final:"
          npx tsx scripts/count-races.ts 2>&1 || true
