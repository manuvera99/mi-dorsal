name: Refresh scraped data + push to Convex

on:
  schedule:
    # Cada lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Botón manual desde GitHub Actions

jobs:
  scrape:
    name: Scrape + ingest to Convex
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run scrapers (RFEA, FEDME, ITRA, Sportmaniacs, Runedia)
        run: |
          echo "=== Scrape RFEA ==="
          npm run ingest:rfea 2>&1 | tail -20 || echo "RFEA failed, continuing"
          echo ""
          echo "=== Scrape FEDME ==="
          npm run ingest:fedme 2>&1 | tail -20 || echo "FEDME failed, continuing"
          echo ""
          echo "=== Scrape ITRA ==="
          npm run ingest:itra 2>&1 | tail -20 || echo "ITRA failed, continuing"
          echo ""
          echo "=== Scrape Sportmaniacs ==="
          npm run ingest:sportmaniacs 2>&1 | tail -20 || echo "Sportmaniacs failed, continuing"
          echo ""
          echo "=== Scrape Runedia ==="
          npm run ingest:runedia 2>&1 | tail -20 || echo "Runedia failed, continuing"
          echo ""
          echo "=== Merge all ==="
          npm run ingest:all 2>&1 | tail -20 || echo "Merge failed, continuing"

      - name: Push to Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "❌ CONVEX_DEPLOY_KEY no configurado como secret en GitHub"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ]; then
            echo "❌ NEXT_PUBLIC_CONVEX_URL no configurado como secret en GitHub"
            exit 1
          fi
          echo "=== Push to Convex ==="
          NEXT_PUBLIC_CONVEX_URL="$NEXT_PUBLIC_CONVEX_URL" \
          CONVEX_DEPLOYMENT="dev:manuvera08:mi-dorsal" \
          npm run ingest:to-convex 2>&1 | tail -30

      - name: Commit updated data (backup en el repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/output/ lib/mock/data.ts
          git diff --staged --quiet || git commit -m "chore: refresh scraped data [skip ci]" || echo "Nothing to commit"
          git push || echo "Nothing to push"
